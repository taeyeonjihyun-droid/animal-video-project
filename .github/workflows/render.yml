name: Render animal video (수동 실행)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드 선택"
        required: false
        default: "render"
        type: choice
        options:
          - render
          - prompts
          - both

permissions:
  contents: read

env:
  RUN_MODE: ${{ inputs.run_mode || 'render' }}

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}-${{ env.RUN_MODE }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean previous outputs
        run: |
          mkdir -p output
          find output -mindepth 1 ! -name ".gitkeep" -delete

      - name: Generate scene prompts
        if: ${{ env.RUN_MODE == 'prompts' || env.RUN_MODE == 'both' }}
        run: python main.py --generate-image-prompts --prompts-output output/scene_image_prompts.json

      - name: Render video
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'both' }}
        run: python main.py

      - name: Check rendered videos
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'both' }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "output/ 폴더에서 렌더링된 MP4를 찾지 못했습니다."
            exit 1
          fi
          printf "렌더링 결과:\n%s\n" "${files[@]}"

      - name: Check generated prompts
        if: ${{ env.RUN_MODE == 'prompts' || env.RUN_MODE == 'both' }}
        run: |
          test -f output/scene_image_prompts.json
          echo "프롬프트 결과 확인: output/scene_image_prompts.json"

      - name: Upload rendered video
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-animal-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated prompts
        if: ${{ env.RUN_MODE == 'prompts' || env.RUN_MODE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: scene-image-prompts
          path: output/scene_image_prompts.json
          if-no-files-found: error
          retention-days: 7

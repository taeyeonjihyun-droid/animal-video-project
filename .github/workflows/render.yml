name: Render animal video

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드를 선택하세요"
        required: true
        default: "both"
        type: choice
        options:
          - render
          - prompts
          - both

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare output folder
        run: |
          mkdir -p output

      - name: Generate scene image prompts
        if: ${{ github.event.inputs.run_mode == 'prompts' || github.event.inputs.run_mode == 'both' }}
        run: |
          python main.py \
            --generate-image-prompts \
            --prompts-output output/scene_image_prompts.json

      - name: Render Busan shark trip video
        if: ${{ github.event.inputs.run_mode == 'render' || github.event.inputs.run_mode == 'both' }}
        run: |
          python main.py

      - name: Check rendered video
        if: ${{ github.event.inputs.run_mode == 'render' || github.event.inputs.run_mode == 'both' }}
        run: |
          echo "렌더링 결과 확인"
          ls -lah output
          test -f output/busan_shark_trip.mp4

      - name: Upload rendered video
        if: ${{ github.event.inputs.run_mode == 'render' || github.event.inputs.run_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: busan-shark-trip-video
          path: output/busan_shark_trip.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload scene prompts
        if: ${{ github.event.inputs.run_mode == 'prompts' || github.event.inputs.run_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: busan-shark-trip-prompts
          path: output/scene_image_prompts.json
          if-no-files-found: error
          retention-days: 7

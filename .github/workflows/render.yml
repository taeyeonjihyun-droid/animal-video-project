name: Render animal video (수동 실행)

on:
  workflow_dispatch:

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render video
        run: python main.py

      - name: Check rendered videos
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then
            echo "output/ 폴더에서 렌더링된 MP4를 찾지 못했습니다."
            exit 1
          fi
          printf "렌더링 결과:\n%s\n" "${files[@]}"

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-animal-video
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7
